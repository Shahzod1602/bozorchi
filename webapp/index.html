<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bozorlik</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --g1:#43A047;--g2:#2E7D32;--g3:#E8F5E9;--g4:#C8E6C9;
  --bg:var(--tg-theme-bg-color,#F4F6F8);
  --card:var(--tg-theme-secondary-bg-color,#fff);
  --text:var(--tg-theme-text-color,#1C1C1E);
  --hint:var(--tg-theme-hint-color,#8E8E93);
  --r:16px;--shadow:0 2px 12px rgba(0,0,0,.07);
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:80px;overflow-x:hidden}

/* HEADER */
.hdr{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;padding:12px 16px 14px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:200;box-shadow:0 2px 16px rgba(67,160,71,.3)}
.hdr-back{font-size:22px;cursor:pointer;padding:2px 10px 2px 0;display:none;opacity:.95}
.hdr-back.vis{display:block}
.hdr-title{font-size:17px;font-weight:700;letter-spacing:-.2px;flex:1}
.hdr-icon{font-size:20px}

/* SCREENS */
.scr{display:none;padding:16px;animation:fadeIn .2s ease}
.scr.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid rgba(0,0,0,.08);display:flex;z-index:200;padding:6px 0 calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.06)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 2px;cursor:pointer;border:none;background:none;color:var(--hint);transition:color .2s}
.nb.on{color:var(--g1)}
.nb .ni{font-size:21px;line-height:1}
.nb .nl{font-size:10px;font-weight:500}
.nb.on .ni{filter:drop-shadow(0 2px 4px rgba(67,160,71,.4))}

/* CARDS */
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card-t{font-size:15px;font-weight:600;margin-bottom:4px}
.card-s{font-size:13px;color:var(--hint)}
.sec-t{font-size:12px;font-weight:600;color:var(--hint);text-transform:uppercase;letter-spacing:.6px;margin:4px 0 10px}

/* HERO BANNER */
.hero{background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:20px;padding:20px;color:#fff;margin-bottom:16px;position:relative;overflow:hidden}
.hero::after{content:'🛒';position:absolute;right:-8px;bottom:-12px;font-size:80px;opacity:.12}
.hero-label{font-size:12px;opacity:.85;margin-bottom:4px}
.hero-amount{font-size:30px;font-weight:800;letter-spacing:-1px;margin-bottom:12px}
.hero-row{display:flex;gap:0}
.hero-col{flex:1;text-align:center;padding:10px 4px;background:rgba(255,255,255,.12);border-radius:12px;margin:0 3px}
.hero-col:first-child{margin-left:0}
.hero-col:last-child{margin-right:0}
.hero-col .hv{font-size:17px;font-weight:700}
.hero-col .hl{font-size:10px;opacity:.8;margin-top:2px}

/* HOME GRID */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gc{background:var(--card);border-radius:var(--r);padding:18px 14px 16px;text-align:center;cursor:pointer;box-shadow:var(--shadow);border:none;width:100%;transition:transform .12s,box-shadow .12s;position:relative;overflow:hidden}
.gc:active{transform:scale(.96);box-shadow:0 1px 6px rgba(0,0,0,.08)}
.gc.acc{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.gc .gi{font-size:30px;margin-bottom:8px;display:block}
.gc .gt{font-size:13px;font-weight:700;color:var(--text)}
.gc.acc .gt{color:#fff}
.gc .gs{font-size:11px;color:var(--hint);margin-top:3px}
.gc.acc .gs{color:rgba(255,255,255,.8)}
.gc .badge{position:absolute;top:10px;right:10px;background:#FF3B30;color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:10px}

/* INPUTS */
.iw{margin-bottom:12px}
.iw textarea,.iw input{width:100%;background:var(--card);border:1.5px solid transparent;border-radius:14px;padding:13px 15px;font-size:15px;color:var(--text);resize:none;outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit;box-shadow:var(--shadow)}
.iw textarea:focus,.iw input:focus{border-color:var(--g1);box-shadow:0 0 0 3px rgba(67,160,71,.1)}
.iw label{display:block;font-size:12px;font-weight:600;color:var(--hint);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}

/* BUTTONS */
.btn{width:100%;padding:15px;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;border:none;transition:all .15s;letter-spacing:-.1px}
.btn:active{transform:scale(.98);opacity:.9}
.btn-p{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 4px 14px rgba(67,160,71,.35)}
.btn-s{background:var(--g3);color:var(--g2);margin-top:8px}
.btn-g{background:var(--card);color:var(--text);box-shadow:var(--shadow);margin-top:8px}
.btn-sm{width:auto;padding:9px 18px;font-size:13px;display:inline-flex;align-items:center;gap:5px}
.btn-danger{background:#FFF0F0;color:#FF3B30;margin-top:8px}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:14px}
.chip{padding:8px 14px;background:var(--card);border-radius:20px;font-size:13px;cursor:pointer;border:1.5px solid transparent;transition:all .15s;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.06);font-weight:500;color:var(--text)}
.chip.on{background:var(--g3);border-color:var(--g1);color:var(--g2);font-weight:600}

/* PREF GRID */
.pref-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.pref-item{background:var(--card);border-radius:14px;padding:12px;cursor:pointer;border:2px solid transparent;transition:all .15s;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.pref-item.on{background:var(--g3);border-color:var(--g1)}
.pref-item .pi-icon{font-size:22px;flex-shrink:0}
.pref-item .pi-text{font-size:12px;font-weight:600;line-height:1.3;color:var(--text)}
.pref-item.on .pi-text{color:var(--g2)}
.pref-item .pi-check{width:18px;height:18px;border-radius:50%;border:2px solid #ddd;margin-left:auto;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:10px}
.pref-item.on .pi-check{background:var(--g1);border-color:var(--g1);color:#fff}

/* CUSTOM PREF INPUT */
.custom-pref-wrap{display:flex;gap:8px;margin-bottom:14px}
.custom-pref-wrap input{flex:1;background:var(--card);border:1.5px solid transparent;border-radius:12px;padding:11px 14px;font-size:14px;outline:none;color:var(--text)}
.custom-pref-wrap input:focus{border-color:var(--g1)}
.custom-pref-wrap button{background:var(--g1);color:#fff;border:none;border-radius:12px;padding:11px 16px;font-size:20px;cursor:pointer}

/* RESULT */
.result{background:var(--card);border-radius:var(--r);padding:16px;white-space:pre-wrap;font-size:14px;line-height:1.75;color:var(--text);margin-top:14px;box-shadow:var(--shadow);max-height:65vh;overflow-y:auto}
.result strong,.result b{font-weight:700;color:var(--g2)}

/* INGREDIENT LIST */
.ing-list{list-style:none}
.ing-row{display:flex;align-items:center;padding:11px 0;border-bottom:1px solid rgba(0,0,0,.05);gap:12px}
.ing-row:last-child{border:none}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--g1);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent;transition:all .15s}
.chk.done{background:var(--g1);border-color:var(--g1);color:#fff}
.ing-name{flex:1;font-size:14px;line-height:1.3}
.ing-name.done{text-decoration:line-through;color:var(--hint)}
.ing-price{font-size:12px;color:var(--g1);font-weight:600;white-space:nowrap}

/* PROGRESS */
.prog-bar{height:6px;background:var(--g4);border-radius:3px;margin:12px 0 4px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--g1),var(--g2));border-radius:3px;transition:width .4s ease}
.prog-txt{font-size:12px;color:var(--hint);text-align:right}

/* TABS */
.tabs{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow)}
.tab{flex:1;padding:9px 4px;text-align:center;border-radius:11px;font-size:13px;cursor:pointer;font-weight:500;color:var(--hint);border:none;background:none;transition:all .2s}
.tab.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(67,160,71,.3)}

/* PROFILE ROWS */
.p-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid rgba(0,0,0,.05)}
.p-row:last-child{border:none}
.p-row .pr-l{font-size:14px;font-weight:500;display:flex;align-items:center;gap:8px}
.p-row .pr-l .pr-icon{font-size:18px}
.p-row input{width:110px;padding:8px 12px;border:1.5px solid #E5E5EA;border-radius:10px;font-size:14px;text-align:right;outline:none;background:var(--bg);color:var(--text)}
.p-row input:focus{border-color:var(--g1)}

/* LANG SWITCH */
.lang-sw{display:flex;background:var(--bg);border-radius:12px;padding:3px;gap:3px}
.lsb{flex:1;padding:8px 10px;text-align:center;border-radius:10px;cursor:pointer;font-size:13px;font-weight:500;color:var(--hint);border:none;background:none;transition:all .2s}
.lsb.on{background:var(--card);color:var(--g2);font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.1)}

/* LOADER */
.loader{text-align:center;padding:50px 20px}
.spin{display:inline-block;width:36px;height:36px;border:3px solid var(--g4);border-top-color:var(--g1);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{font-size:14px;color:var(--hint)}

/* EMPTY */
.empty{text-align:center;padding:48px 24px}
.empty .ei{font-size:56px;margin-bottom:14px}
.empty h3{font-size:17px;font-weight:600;margin-bottom:8px}
.empty p{font-size:14px;color:var(--hint);line-height:1.6}

/* TOAST */
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#1C1C1E;color:#fff;padding:10px 20px;border-radius:20px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

/* DIVIDER */
.divider{height:1px;background:rgba(0,0,0,.06);margin:4px 0 14px}
</style>
</head>
<body>

<div class="hdr">

<!-- NAV -->

</nav>

<script>
const tg = window.Telegram?.WebApp;
if(tg){tg.expand();tg.ready();}
const userId = tg?.initDataUnsafe?.user?.id || null;

const PREFS = [
  {id:'vegetarian', icon:'🥦', uz:"Vegetarian\n(go'sht yemas)", ru:"Вегетарианец\n(без мяса)"},

  {id:'halal', icon:'☪️', uz:"Faqat\nhalol", ru:"Только\nхаляль"},

];

const TEXTS = {
  uz:{
    home_title:'🛒 Bozorlik', home_sec:'Nima qilmoqchisiz?',
    suggest_title:'Ovqat tavsiya', recipe_title:'Retsept izla',
    budget_title:'Byudjet rejasi', profile_title:'Profil',

    save_btn:'✅ Saqlash', saved:'✅ Saqlandi!',
    no_list:'Hali ro\'yxat yo\'q', no_list_sub:'Ovqat tavsiya so\'rang — ro\'yxat shu yerda chiqadi',
    shopping_title:'🛒 Bozorlik ro\'yxati', done_btn:'✅ Xarid tugadi',
    all:'Barchasi', pending:'Qoldi', bought:'Olindi', progress_suf:'ta olindi',
    budget_label2:'Haftalik byudjet', daily_label:'Kunlik', family_stat:'Oila',
    bought_stat:'Belgilangan', custom_ph:'Boshqa cheklov...',
    home_cards:[
      {icon:'🍽️',t:'Ovqat tavsiya',s:'AI eng yaxshi tavsiya beradi',tab:'suggest',acc:true},

let prof = {family_size:2,weekly_budget:0,language:'uz',preferences:[],meal_name:'',ingredients:[]};
let checked = JSON.parse(localStorage.getItem('chk_'+userId)||'{}');
let curTab = 'home', navStack = [];
const L = () => TEXTS[prof.language] || TEXTS.uz;

// ─── API ────────────────────────────────────────
async function api(path, method='GET', body=null){
  const opts={method,headers:{'Content-Type':'application/json'}};
  if(body) opts.body=JSON.stringify(body);
  const r=await fetch(path,opts);
  return r.json();
}

async function loadProfile(){
  if(!userId) return renderAll();
  try{
    const d=await api(`/api/profile?user_id=${userId}`);
    if(!d.error){
      prof={...prof,...d};
      checked=JSON.parse(localStorage.getItem('chk_'+userId)||'{}');
    }
  }catch(e){}
  renderAll();
}

// ─── RENDER ─────────────────────────────────────
function renderAll(){
  renderHome();renderBudgetHero();renderProfilePage();applyTexts();
}

function applyTexts(){
  const t=L();
  document.querySelectorAll('[data-uz]').forEach(el=>{
    el.textContent=el.dataset[prof.language]||el.dataset.uz;
  });
  document.getElementById('suggestLabel').textContent=t.suggest_label;
  document.getElementById('recipeLabel').textContent=t.recipe_label;
  document.getElementById('budgetLabel').textContent=t.budget_label;
  document.getElementById('preferenceInput').placeholder=t.quick?.[0]||'';
  document.getElementById('recipeInput').placeholder=t.popular?.[0]||'';
  document.getElementById('budgetInput').placeholder='500000';
  document.getElementById('suggestBtn').textContent=t.suggest_btn;
  document.getElementById('recipeBtn').textContent=t.recipe_btn;
  document.getElementById('budgetBtn').textContent=t.budget_btn;
  document.getElementById('weeklyBtn').textContent=t.weekly_btn;
  document.getElementById('familyLabel').textContent=t.family_label;
  document.getElementById('budgetProfileLabel').textContent=t.budget_profile_label;
  document.getElementById('prefSectionTitle').textContent=t.pref_section;
  document.getElementById('customPrefInput').placeholder=t.custom_ph;
  renderChips();renderPrefGrid();
}

function renderHome(){
  const t=L();
  document.getElementById('homeSectionTitle').textContent=t.home_sec;
  let hero='';
  if(prof.weekly_budget>0){
    const total=prof.ingredients.length;
    const bought=prof.ingredients.filter((_,i)=>checked[i]).length;
    hero=`<div class="hero">
      <div class="hero-label">${t.budget_label2}</div>
      <div class="hero-amount">${fmtNum(prof.weekly_budget)} so'm</div>
      <div class="hero-row">
        <div class="hero-col"><div class="hv">${fmtNum(Math.round(prof.weekly_budget/7))}</div><div class="hl">${t.daily_label} (so'm)</div></div>
        <div class="hero-col"><div class="hv">${prof.family_size}</div><div class="hl">${t.family_stat}</div></div>
        <div class="hero-col"><div class="hv">${bought}/${total}</div><div class="hl">${t.bought_stat}</div></div>
      </div>
    </div>`;
  }
  document.getElementById('homeHero').innerHTML=hero;

  const hasPrefs=prof.preferences&&prof.preferences.length>0;
  let grid='';
  t.home_cards.forEach(c=>{
    const onclick=c.tab?`goTab('${c.tab}')`:`${c.action}()`;
    const badge=c.tab==='profile'&&hasPrefs?`<span class="badge">${prof.preferences.length}</span>`:'';
    grid+=`<button class="gc${c.acc?' acc':''}" onclick="${onclick}">
      ${badge}
      <span class="gi">${c.icon}</span>
      <div class="gt">${c.t}</div>
      <div class="gs">${c.s}</div>
    </button>`;
  });
  document.getElementById('homeGrid').innerHTML=grid;
}

function renderChips(){
  const t=L();
  const qc=document.getElementById('quickChips');
  if(qc) qc.innerHTML=t.quick.map(q=>`<span class="chip" onclick="pickChip(this,'pref','${q}')">${q}</span>`).join('');
  const rc=document.getElementById('recipeChips');
  if(rc) rc.innerHTML=t.popular.map(r=>`<span class="chip" onclick="pickChip(this,'rec','${r}')">${r}</span>`).join('');
}

function pickChip(el,type,val){
  const container=type==='pref'?'quickChips':'recipeChips';
  document.querySelectorAll(`#${container} .chip`).forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  document.getElementById(type==='pref'?'preferenceInput':'recipeInput').value=val;
}

function renderBudgetHero(){
  const t=L();
  const el=document.getElementById('budgetHero');
  if(prof.weekly_budget>0){
    el.innerHTML=`<div class="hero" style="margin-bottom:14px">
      <div class="hero-label">${t.budget_label2}</div>
      <div class="hero-amount">${fmtNum(prof.weekly_budget)} so'm</div>
    </div>`;
    document.getElementById('budgetInput').value=prof.weekly_budget;
  } else {
    el.innerHTML='';
  }
}

function renderPrefGrid(){
  const grid=document.getElementById('prefGrid');
  const lang=prof.language;
  grid.innerHTML=PREFS.map(p=>{
    const on=prof.preferences.includes(p.id);
    return `<div class="pref-item${on?' on':''}" onclick="togglePref('${p.id}',this)">
      <span class="pi-icon">${p.icon}</span>
      <span class="pi-text">${p[lang]||p.uz}</span>
      <span class="pi-check">${on?'✓':''}</span>
    </div>`;
  }).join('');
  renderCustomPrefs();
}

function renderCustomPrefs(){
  const customs=prof.preferences.filter(p=>!PREFS.find(x=>x.id===p));
  const el=document.getElementById('customPrefs');
  if(!customs.length){el.innerHTML='';return;}
  el.innerHTML='<div class="chips">'+customs.map(c=>
    `<span class="chip on" onclick="removeCustomPref('${c}')">${c} ✕</span>`
  ).join('')+'</div>';
}

function togglePref(id,el){
  const idx=prof.preferences.indexOf(id);
  if(idx>-1) prof.preferences.splice(idx,1);
  else prof.preferences.push(id);
  el.classList.toggle('on');
  el.querySelector('.pi-check').textContent=prof.preferences.includes(id)?'✓':'';
  renderHome();
}

function addCustomPref(){
  const input=document.getElementById('customPrefInput');
  const val=input.value.trim();
  if(val&&!prof.preferences.includes(val)){
    prof.preferences.push(val);
    input.value='';
    renderCustomPrefs();
    renderHome();
  }
}

function removeCustomPref(val){
  prof.preferences=prof.preferences.filter(p=>p!==val);
  renderCustomPrefs();renderHome();
}

function renderProfilePage(){
  document.getElementById('familyInput').value=prof.family_size;
  document.getElementById('budgetProfileInput').value=prof.weekly_budget||'';
  document.getElementById('lz').classList.toggle('on',prof.language==='uz');
  document.getElementById('lr').classList.toggle('on',prof.language==='ru');
  renderPrefGrid();
  renderShoppingList();
}

function renderShoppingList(){
  const t=L();
  const sec=document.getElementById('profileListSection');
  if(!prof.ingredients||prof.ingredients.length===0){
    sec.innerHTML=`<div style="height:12px"></div><div class="empty">
      <div class="ei">🛒</div>
      <h3>${t.no_list}</h3>
      <p>${t.no_list_sub}</p>
    </div>`;
    return;
  }
  const total=prof.ingredients.length;
  const boughtCount=prof.ingredients.filter((_,i)=>checked[i]).length;
  const pct=total>0?Math.round(boughtCount/total*100):0;
  const rows=prof.ingredients.map((item,i)=>{
    const d=!!checked[i];
    return `<li class="ing-row">
      <button class="chk${d?' done':''}" onclick="toggleIng(${i})">${d?'✓':''}</button>
      <span class="ing-name${d?' done':''}">${item.name}</span>
      <span class="ing-price">${item.price||''}</span>
    </li>`;
  }).join('');

  sec.innerHTML=`<div style="height:16px"></div>
    <p class="sec-t">${t.shopping_title}: ${prof.meal_name||''}</p>
    <div class="tabs">
      <button class="tab on" id="tab-all" onclick="filterIng('all')">${t.all} (${total})</button>
      <button class="tab" id="tab-p" onclick="filterIng('pending')">${t.pending} (${total-boughtCount})</button>
      <button class="tab" id="tab-d" onclick="filterIng('done')">${t.bought} (${boughtCount})</button>
    </div>
    <div class="card">
      <ul class="ing-list">${rows}</ul>
      <div class="prog-bar"><div class="prog-fill" style="width:${pct}%"></div></div>
      <div class="prog-txt">${boughtCount}/${total} ${t.progress_suf}</div>
    </div>
    <button class="btn btn-danger" onclick="clearChecked()">${t.done_btn}</button>`;
}

function filterIng(mode){
  ['all','p','d'].forEach(t=>document.getElementById('tab-'+t)?.classList.remove('on'));
  document.getElementById('tab-'+(mode==='all'?'all':mode==='pending'?'p':'d')).classList.add('on');
  document.querySelectorAll('.ing-row').forEach((el,i)=>{
    const d=!!checked[i];
    el.style.display=mode==='all'?'':(mode==='pending'?d?'none':'':d?'':'none');
  });
}

function toggleIng(i){
  checked[i]=!checked[i];
  localStorage.setItem('chk_'+userId,JSON.stringify(checked));
  renderShoppingList();
}

function clearChecked(){
  const msg=prof.language==='uz'?'Xaridni tugatdimi?':'Покупки завершены?';
  if(tg){tg.showConfirm(msg,ok=>{if(ok){checked={};localStorage.setItem('chk_'+userId,'{}');renderShoppingList();}});}
  else if(confirm(msg)){checked={};localStorage.setItem('chk_'+userId,'{}');renderShoppingList();}
}

// ─── AI ACTIONS ─────────────────────────────────
function showLoader(id){
  document.getElementById(id).innerHTML=`<div class="loader"><div class="spin"></div><p>${L().loading}</p></div>`;
}

function showAIResult(id,text,ingredients){
  const fmtText=text
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.*?)\*/g,'$1');
  let html=`<div class="result">${fmtText}</div>`;
  if(ingredients&&ingredients.length>0){
    const rows=ingredients.map((item,i)=>{
      const d=!!checked[i];
      return `<li class="ing-row">
        <button class="chk${d?' done':''}" onclick="tempToggle(${i},'${id}')">${d?'✓':''}</button>
        <span class="ing-name${d?' done':''}">${item.name}</span>
        <span class="ing-price">${item.price||''}</span>
      </li>`;
    }).join('');
    html+=`<div class="card" style="margin-top:12px">
      <p class="card-t">🛒 Masalliqlar</p>
      <ul class="ing-list">${rows}</ul>
    </div>`;
  }
  const el=document.getElementById(id);
  el.innerHTML=html;
  el.scrollIntoView({behavior:'smooth',block:'start'});
}

function tempToggle(i,containerId){
  checked[i]=!checked[i];
  localStorage.setItem('chk_'+userId,JSON.stringify(checked));
  const btns=document.querySelectorAll(`#${containerId} .ing-row .chk`);
  if(btns[i]){
    btns[i].classList.toggle('done',!!checked[i]);
    btns[i].textContent=checked[i]?'✓':'';
    btns[i].nextElementSibling.classList.toggle('done',!!checked[i]);
  }
}

async function doSuggest(){
  const pref=document.getElementById('preferenceInput').value.trim();
  if(!pref){toast(prof.language==='uz'?"Iltimos, yozing":'Пожалуйста, введите');return;}
  showLoader('suggestResult');
  try{
    const d=await api('/api/suggest','POST',{user_id:userId,preference:pref});
    if(d.error) throw new Error(d.error);
    prof.meal_name=d.meal_name;
    prof.ingredients=d.ingredients||[];
    checked={};localStorage.setItem('chk_'+userId,'{}');
    showAIResult('suggestResult',d.text,d.ingredients);
    renderShoppingList();renderHome();
  }catch(e){
    document.getElementById('suggestResult').innerHTML=`<div class="card" style="color:#FF3B30">Xatolik yuz berdi. Qaytadan urining.</div>`;
  }
}

async function doRecipe(){
  const name=document.getElementById('recipeInput').value.trim();
  if(!name){toast(prof.language==='uz'?"Ovqat nomini yozing":'Введите название');return;}
  showLoader('recipeResult');
  try{
    const d=await api('/api/recipe','POST',{user_id:userId,meal_name:name});
    if(d.error) throw new Error(d.error);
    showAIResult('recipeResult',d.text,d.ingredients);
  }catch(e){
    document.getElementById('recipeResult').innerHTML=`<div class="card" style="color:#FF3B30">Xatolik yuz berdi.</div>`;
  }
}

async function doBudgetPlan(){
  const budget=parseFloat(document.getElementById('budgetInput').value);
  if(!budget||budget<10000){toast(prof.language==='uz'?'Kamida 10,000 so\'m':'Минимум 10,000 сум');return;}
  showLoader('budgetResult');
  try{
    const d=await api('/api/budget-plan','POST',{user_id:userId,budget});
    if(d.error) throw new Error(d.error);
    prof.weekly_budget=budget;
    renderBudgetHero();renderHome();
    showAIResult('budgetResult',d.text,null);
  }catch(e){
    document.getElementById('budgetResult').innerHTML=`<div class="card" style="color:#FF3B30">Xatolik yuz berdi.</div>`;
  }
}

async function doWeeklyPlan(){
  goTab('budget');
  showLoader('budgetResult');
  try{
    const d=await api('/api/weekly-plan','POST',{user_id:userId});
    if(d.error) throw new Error(d.error);
    showAIResult('budgetResult',d.text,null);
  }catch(e){
    document.getElementById('budgetResult').innerHTML=`<div class="card" style="color:#FF3B30">Xatolik yuz berdi.</div>`;
  }
}

function openList(){ goTab('profile'); }

// ─── PROFILE SAVE ────────────────────────────────
async function saveProfile(){
  const family=parseInt(document.getElementById('familyInput').value)||2;
  const budget=parseFloat(document.getElementById('budgetProfileInput').value)||0;
  prof.family_size=Math.max(1,Math.min(20,family));
  prof.weekly_budget=budget;
  if(userId){
    await api('/api/profile','POST',{
      user_id:userId, family_size:prof.family_size,
      weekly_budget:prof.weekly_budget, language:prof.language,
      preferences:prof.preferences
    });
  }
  toast(L().saved);
  renderAll();
}

async function setLang(lang){
  prof.language=lang;
  document.getElementById('lz').classList.toggle('on',lang==='uz');
  document.getElementById('lr').classList.toggle('on',lang==='ru');
  if(userId) await api('/api/profile','POST',{user_id:userId,language:lang});
  renderAll();goTab('home');
}

// ─── NAV ────────────────────────────────────────
function goTab(tab){
  navStack.push(curTab);curTab=tab;
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('scr-'+tab).classList.add('on');
  const nb=document.getElementById('nb-'+tab);
  if(nb) nb.classList.add('on');
  const titles={home:L().home_title,suggest:L().suggest_title,recipe:L().recipe_title,budget:L().budget_title,profile:L().profile_title};
  document.getElementById('hdrTitle').textContent=titles[tab]||'🛒 Bozorlik';
  document.getElementById('backBtn').classList.toggle('vis',tab!=='home');
  window.scrollTo(0,0);
}

function goBack(){
  const prev=navStack.pop()||'home';
  curTab=prev;
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('scr-'+prev).classList.add('on');
  const nb=document.getElementById('nb-'+prev);
  if(nb) nb.classList.add('on');
  document.getElementById('backBtn').classList.toggle('vis',prev!=='home');
}

// ─── UTILS ──────────────────────────────────────
function fmtNum(n){ return Number(n).toLocaleString('uz-UZ'); }

function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2000);
}

// ─── INIT ────────────────────────────────────────
loadProfile();
</script>
</body>
</html>
