<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bozorlik</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#111214;--card:#1C1F23;--card2:#252830;
  --green:#4DB651;--green-d:#2D8A33;--green-bg:rgba(77,182,81,.13);
  --text:#F2F2F2;--hint:#8A8A8E;
  --danger:#E53935;--danger-bg:rgba(229,57,53,.13);
  --border:rgba(255,255,255,.07);--r:16px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:76px;overflow-x:hidden}

/* SCREENS */
.scr{display:none;animation:fadeIn .2s ease}
.scr.on{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* HEADER */
.hdr{padding:14px 16px 12px;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:200}
.hdr-av{width:36px;height:36px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex-shrink:0}
.hdr-title{font-size:19px;font-weight:700;flex:1;letter-spacing:-.3px}
.hdr-more{font-size:22px;color:var(--hint);cursor:pointer;padding:2px 0 2px 8px;letter-spacing:1px}

/* NAV */
.nav{position:fixed;bottom:0;left:0;right:0;background:#16181C;border-top:1px solid var(--border);display:flex;z-index:200;padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 2px;cursor:pointer;border:none;background:none;color:var(--hint);transition:color .2s}
.nb.on{color:var(--green)}
.nb .ni{font-size:22px;line-height:1.1}
.nb .nl{font-size:10px;font-weight:600;letter-spacing:.1px}
.nb.on .ni{filter:drop-shadow(0 2px 6px rgba(77,182,81,.5))}

/* BUDGET HERO */
.budget-card{background:linear-gradient(135deg,#1C3A1E,#243B26);border:1px solid rgba(77,182,81,.18);border-radius:20px;padding:22px 20px;margin:16px 16px 12px;position:relative;overflow:hidden;cursor:pointer}
.budget-card::after{content:'🛒';position:absolute;right:-8px;bottom:-14px;font-size:88px;opacity:.07;pointer-events:none}
.budget-amount{font-size:36px;font-weight:800;letter-spacing:-1.5px;margin-bottom:6px}
.budget-sub{font-size:13px;color:rgba(255,255,255,.55)}
.budget-sub b{color:var(--green);font-weight:600}

/* ACTION ROWS */
.act-row{background:var(--card);border-radius:16px;padding:16px 18px;margin:0 16px 10px;display:flex;align-items:center;gap:14px;cursor:pointer;border:1px solid var(--border);transition:background .12s;-webkit-user-select:none;user-select:none}
.act-row:active{background:var(--card2)}
.act-icon{font-size:26px;flex-shrink:0}
.act-text{flex:1}
.act-title{font-size:15px;font-weight:600;margin-bottom:2px}
.act-sub{font-size:12px;color:var(--hint)}
.act-arrow{font-size:20px;color:var(--hint);opacity:.7}

/* SECTION TITLE */
.sec-t{font-size:12px;font-weight:600;color:var(--hint);padding:14px 16px 8px;text-transform:uppercase;letter-spacing:.5px}

/* PREV ROWS (last items on home) */
.prev-wrap{margin:0 16px;border-radius:16px;overflow:hidden;border:1px solid var(--border);margin-bottom:16px}
.prev-row{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border)}
.prev-row:last-child{border:none}
.prev-emoji{font-size:24px;flex-shrink:0}
.prev-name{flex:1;font-size:14px;font-weight:500}
.prev-name.done{text-decoration:line-through;color:var(--hint)}
.prev-price{font-size:13px;color:var(--green);font-weight:700}

/* SEARCH */
.search-wrap{position:relative;margin-bottom:14px}
.search-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px;pointer-events:none}
.search-wrap input{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:13px 16px 13px 44px;font-size:15px;color:var(--text);outline:none;font-family:inherit;transition:border-color .2s}
.search-wrap input:focus{border-color:var(--green)}
.search-wrap input::placeholder{color:var(--hint)}

/* CHIPS */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{padding:8px 16px;background:var(--card);border-radius:20px;font-size:13px;cursor:pointer;border:1.5px solid var(--border);transition:all .15s;white-space:nowrap;font-weight:500;color:var(--text)}
.chip.on{background:var(--green-bg);border-color:var(--green);color:var(--green);font-weight:700}

/* SUB-TABS */
.sub-tabs{display:flex;gap:4px;background:var(--card);border-radius:14px;padding:4px;border:1px solid var(--border);margin-bottom:16px}
.stab{flex:1;padding:9px 4px;text-align:center;border-radius:11px;font-size:12px;cursor:pointer;font-weight:600;color:var(--hint);border:none;background:none;transition:all .2s;white-space:nowrap}
.stab.on{background:var(--green);color:#fff}

/* FOOD CARD */
.food-card{background:var(--card);border-radius:20px;border:1px solid var(--border);margin-top:14px;overflow:hidden}
.food-img{height:170px;background:linear-gradient(135deg,#1C3820,#192e1a);display:flex;align-items:center;justify-content:center;font-size:82px;position:relative}
.food-img-name{position:absolute;bottom:0;left:0;right:0;padding:14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.7));font-size:20px;font-weight:800;color:#fff}
.food-price{font-size:14px;color:var(--green);font-weight:700;margin-bottom:10px}
.food-ingr-t{font-size:12px;color:var(--hint);font-weight:600;margin-bottom:8px;text-transform:uppercase;letter-spacing:.3px}
.food-ingr{list-style:none;margin-bottom:16px}
.food-ingr li{font-size:14px;padding:4px 0;display:flex;align-items:center;gap:8px;color:var(--text)}
.food-ingr li::before{content:'•';color:var(--green);font-size:18px;line-height:1}
.add-btn{width:100%;padding:15px;background:var(--green);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:opacity .15s}
.add-btn:active{opacity:.82}
.add-btn:disabled{background:var(--green-d);opacity:.8}

/* SHOPPING LIST */
.shop-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--border)}
.list-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border)}
.list-item:last-child{border:none}
.l-chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--hint);background:transparent;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:transparent;transition:all .2s}
.l-chk.done{background:var(--green);border-color:var(--green);color:#fff}
.l-name{flex:1;font-size:14px;font-weight:500;line-height:1.3}
.l-name.done{text-decoration:line-through;color:var(--hint)}
.l-price{font-size:13px;color:var(--green);font-weight:700;margin-right:6px;white-space:nowrap}
.l-del{width:32px;height:32px;border-radius:10px;background:var(--danger-bg);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;transition:background .15s}
.l-del:active{background:rgba(229,57,53,.3)}
.list-total{padding:16px;background:var(--card);border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.list-total-l{font-size:15px;color:var(--hint);font-weight:500}
.list-total-r{font-size:20px;font-weight:800}

/* PROFILE ROWS */
.pset-wrap{border-radius:16px;overflow:hidden;border:1px solid var(--border);margin-bottom:16px}
.p-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border)}
.p-row:last-child{border:none}
.pr-l{font-size:14px;font-weight:500;display:flex;align-items:center;gap:10px}
.pr-icon{font-size:20px}
.p-row input[type=number]{width:80px;padding:8px 10px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;font-weight:600;text-align:right;outline:none;background:var(--card2);color:var(--text)}
.p-row input[type=number]:focus{border-color:var(--green)}

/* LANG SWITCH */
.lang-sw{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.lsb{flex:1;padding:7px 10px;text-align:center;border-radius:10px;cursor:pointer;font-size:12px;font-weight:600;color:var(--hint);border:none;background:none;transition:all .2s}
.lsb.on{background:var(--green);color:#fff}

/* PREF ROW (toggle) */
.pref-row{display:flex;align-items:center;gap:14px;padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border)}
.pref-row:last-child{border:none}
.pref-name{flex:1;font-size:14px;font-weight:500}

/* TOGGLE */
.toggle{position:relative;width:50px;height:28px;cursor:pointer;flex-shrink:0}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.t-track{position:absolute;inset:0;border-radius:14px;background:#3A3A3E;transition:background .25s}
.toggle input:checked+.t-track{background:var(--green)}
.t-thumb{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.3);transition:transform .25s;pointer-events:none}
.toggle input:checked~.t-thumb{transform:translateX(22px)}

/* BUTTONS */
.btn{width:100%;padding:15px;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;border:none;transition:all .15s;letter-spacing:-.1px}
.btn:active{opacity:.85;transform:scale(.98)}
.btn-p{background:var(--green);color:#fff}
.btn-s{background:var(--green-bg);color:var(--green);border:1px solid rgba(77,182,81,.2)}
.btn-danger{background:var(--danger-bg);color:var(--danger);border:1px solid rgba(229,57,53,.2)}

/* INPUT */
.iw{margin-bottom:12px}
.iw label{display:block;font-size:11px;font-weight:700;color:var(--hint);margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
.iw input,.iw textarea{width:100%;background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:13px 15px;font-size:15px;color:var(--text);resize:none;outline:none;transition:border-color .2s;font-family:inherit}
.iw input:focus,.iw textarea:focus{border-color:var(--green)}
.iw input::placeholder,.iw textarea::placeholder{color:var(--hint)}

/* RESULT */
.result{background:var(--card);border-radius:var(--r);border:1px solid var(--border);padding:16px;white-space:pre-wrap;font-size:14px;line-height:1.8;color:var(--text);margin-top:14px;max-height:60vh;overflow-y:auto}
.result strong,.result b{font-weight:700;color:var(--green)}

/* LOADER */
.loader{text-align:center;padding:48px 20px}
.spin{display:inline-block;width:36px;height:36px;border:3px solid rgba(77,182,81,.2);border-top-color:var(--green);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes spin{to{transform:rotate(360deg)}}
.loader p{font-size:14px;color:var(--hint)}

/* EMPTY */
.empty{text-align:center;padding:56px 24px}
.ei{font-size:58px;margin-bottom:14px}
.empty h3{font-size:17px;font-weight:700;margin-bottom:8px}
.empty p{font-size:14px;color:var(--hint);line-height:1.6}

/* TOAST */
.toast{position:fixed;top:68px;left:50%;transform:translateX(-50%);background:#2C2C2E;color:var(--text);padding:10px 20px;border-radius:20px;font-size:14px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;border:1px solid var(--border)}
.toast.show{opacity:1}

.pad{padding:0 16px}
.mt8{margin-top:8px}
.mt12{margin-top:12px}
.err{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;color:var(--danger);font-size:14px;margin-top:14px}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<!-- ═══ HOME ═══ -->
<div class="scr on" id="scr-home">
  <div class="hdr">
    <div class="hdr-av" id="homeAv">B</div>
    <span class="hdr-title">Bozorlik 👋</span>
    <span class="hdr-more">···</span>
  </div>

  <div class="budget-card" id="homeBudget" onclick="goTab('suggest');setSuggestTab('budget')"></div>

  <div class="act-row" onclick="goTab('suggest');setSuggestTab('suggest')">
    <span class="act-icon">🍽️</span>
    <div class="act-text">
      <div class="act-title">Tavsiya</div>
      <div class="act-sub">AI eng yaxshi ovqatni tavsiya qilsin</div>
    </div>
    <span class="act-arrow">›</span>
  </div>

  <div class="act-row" onclick="goTab('list')">
    <span class="act-icon">🛒</span>
    <div class="act-text">
      <div class="act-title">Ro'yxat</div>
      <div class="act-sub" id="homeListSub">Bozorlik ro'yxatini ko'rish</div>
    </div>
    <span class="act-arrow">›</span>
  </div>

  <div class="sec-t" id="homeLastTitle">Oxirgi xeridlar</div>
  <div class="prev-wrap" id="homeLastItems"></div>
</div>

<!-- ═══ SUGGEST / RECIPE / BUDGET ═══ -->
<div class="scr" id="scr-suggest">
  <div class="hdr">
    <span class="hdr-title" id="suggestHdrT">Bugun nima yemochisiz?</span>
  </div>
  <div class="pad" style="padding-top:14px">
    <div class="sub-tabs">
      <button class="stab on" id="st-suggest" onclick="setSuggestTab('suggest')">🍽️ Tavsiya</button>
      <button class="stab" id="st-recipe" onclick="setSuggestTab('recipe')">📖 Retsept</button>
      <button class="stab" id="st-budget" onclick="setSuggestTab('budget')">💰 Byudjet</button>
    </div>

    <!-- suggest -->
    <div id="sub-suggest">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="preferenceInput" placeholder="Tez Ovqatlar">
      </div>
      <div class="chips" id="quickChips"></div>
      <button class="btn btn-p" id="suggestBtn" onclick="doSuggest()">🤖 Tavsiya qil</button>
      <div id="suggestResult"></div>
    </div>

    <!-- recipe -->
    <div id="sub-recipe" style="display:none">
      <div class="search-wrap">
        <span class="search-icon">🔍</span>
        <input type="text" id="recipeInput" placeholder="Osh, Lag'mon...">
      </div>
      <div class="chips" id="recipeChips"></div>
      <button class="btn btn-p" id="recipeBtn" onclick="doRecipe()">🔍 Retseptni ko'rish</button>
      <div id="recipeResult"></div>
    </div>

    <!-- budget -->
    <div id="sub-budget" style="display:none">
      <div id="budgetHeroSub" class="mt8"></div>
      <div class="iw mt12">
        <label>Haftalik byudjet (so'm)</label>
        <input type="number" id="budgetInput" placeholder="500 000" inputmode="numeric">
      </div>
      <button class="btn btn-p" id="budgetBtn" onclick="doBudgetPlan()">📅 Reja tuzish</button>
      <button class="btn btn-s mt8" id="weeklyBtn" onclick="doWeeklyPlan()">📋 Byudjetsiz haftalik reja</button>
      <div id="budgetResult"></div>
    </div>
  </div>
</div>

<!-- ═══ SHOPPING LIST ═══ -->
<div class="scr" id="scr-list">
  <div class="hdr">
    <span style="font-size:22px">🛒</span>
    <span class="hdr-title" id="listHdrTitle">Bozorlik ro'yxati</span>
  </div>
  <div class="pad" style="padding-top:14px" id="shopWrap"></div>
</div>

<!-- ═══ PROFILE ═══ -->
<div class="scr" id="scr-profile">
  <div class="hdr">
    <div class="hdr-av" id="profAv">B</div>
    <span class="hdr-title" id="profTitle">Profil</span>
    <span class="hdr-more">···</span>
  </div>
  <div class="pad" style="padding-top:14px">
    <div class="pset-wrap">
      <div class="p-row">
        <span class="pr-l"><span class="pr-icon">👨‍👩‍👧‍👦</span><span id="familyLabel">Oila soni</span></span>
        <input type="number" id="familyInput" min="1" max="20" value="2">
      </div>
      <div class="p-row">
        <span class="pr-l"><span class="pr-icon">💰</span><span id="budgetLabel">Ro'yxat byudjeti</span></span>
        <input type="number" id="budgetProfileInput" placeholder="0">
      </div>
      <div class="p-row">
        <span class="pr-l"><span class="pr-icon">🌐</span><span>Til</span></span>
        <div class="lang-sw">
          <button class="lsb on" id="lz" onclick="setLang('uz')">🇺🇿 UZ</button>
          <button class="lsb" id="lr" onclick="setLang('ru')">🇷🇺 RU</button>
        </div>
      </div>
    </div>

    <div class="sec-t" id="prefSectionTitle">Chmarglar</div>
    <div class="pset-wrap" id="prefList" style="margin-bottom:16px"></div>

    <button class="btn btn-p" onclick="saveProfile()" id="saveBtn">✅ Saqlash</button>
  </div>
</div>

<!-- NAV -->
<nav class="nav">
  <button class="nb on" id="nb-home" onclick="goTab('home')">
    <span class="ni">🏠</span>
    <span class="nl" data-uz="Home" data-ru="Главная">Home</span>
  </button>
  <button class="nb" id="nb-suggest" onclick="goTab('suggest')">
    <span class="ni">🍽️</span>
    <span class="nl" data-uz="Tavsiya" data-ru="Блюдо">Tavsiya</span>
  </button>
  <button class="nb" id="nb-list" onclick="goTab('list')">
    <span class="ni">🛒</span>
    <span class="nl" data-uz="Ro'yxat" data-ru="Список">Ro'yxat</span>
  </button>
  <button class="nb" id="nb-profile" onclick="goTab('profile')">
    <span class="ni">👤</span>
    <span class="nl" data-uz="Profil" data-ru="Профиль">Profil</span>
  </button>
</nav>

<script>

    daily:'в день',
    kishi:'чел.',
    err:'Ошибка. Попробуйте снова.',
    suggest_h:'Что хотите есть?',
    recipe_h:'Найти рецепт',
    budget_h:'План по бюджету',
  }
};

let prof={family_size:2,weekly_budget:0,language:'uz',preferences:[],meal_name:'',ingredients:[]};
let checked={};
try{checked=JSON.parse(localStorage.getItem('chk_'+userId)||'{}')}catch(e){}
let curTab='home', navStack=[], lastPlan={text:'',ingredients:[],title:''};
const L=()=>T[prof.language]||T.uz;

// ─── API ────────────────────────────────────────
async function api(path,method='GET',body=null){
  const o={method,headers:{'Content-Type':'application/json'}};
  if(body) o.body=JSON.stringify(body);
  const r=await fetch(path,o);
  return r.json();
}

async function loadProfile(){
  if(!userId) return renderAll();
  try{
    const d=await api(`/api/profile?user_id=${userId}`);
    if(!d.error){
      prof={...prof,...d};
      try{checked=JSON.parse(localStorage.getItem('chk_'+userId)||'{}')}catch(e){}
    }
  }catch(e){}
  renderAll();
}

// ─── RENDER ─────────────────────────────────────
function renderAll(){
  const init=userFirstName.charAt(0).toUpperCase();
  document.getElementById('homeAv').textContent=init;
  document.getElementById('profAv').textContent=init;
  renderHome();
  renderProfile();
  renderShopList();
  applyLang();
}

function applyLang(){
  const t=L();
  document.querySelectorAll('[data-uz]').forEach(el=>{
    el.textContent=el.dataset[prof.language]||el.dataset.uz;
  });
  document.getElementById('familyLabel').textContent=t.family_label;
  document.getElementById('budgetLabel').textContent=t.budget_label;
  document.getElementById('prefSectionTitle').textContent=t.pref_section;
  document.getElementById('saveBtn').textContent=t.save_btn;
  document.getElementById('listHdrTitle').textContent=t.list_empty?'Bozorlik ro\'yxati':'Список покупок';
  setSuggestTabText();
  renderChips();
  renderPrefList();
}

function renderHome(){
  const t=L();
  // Budget card
  const bc=document.getElementById('homeBudget');
  if(prof.weekly_budget>0){
    const daily=Math.round(prof.weekly_budget/7);
    bc.innerHTML=`<div class="budget-amount">${fmtNum(prof.weekly_budget)} so'm</div>
      <div class="budget-sub">${fmtNum(daily)} ${t.daily} · <b>${prof.family_size} ${t.kishi}</b></div>`;
  } else {
    bc.innerHTML=`<div class="budget-amount" style="font-size:28px;opacity:.5">Byudjet yo'q</div>
      <div class="budget-sub">Byudjet belgilash uchun bosing · <b>${prof.family_size} ${t.kishi}</b></div>`;
  }
  // Budget hero in budget sub
  const bhs=document.getElementById('budgetHeroSub');
  if(bhs&&prof.weekly_budget>0){
    bhs.innerHTML=`<div class="budget-card" style="margin:0 0 14px">
      <div class="budget-amount" style="font-size:26px">${fmtNum(prof.weekly_budget)} so'm</div>
      <div class="budget-sub">Joriy byudjet</div></div>`;
    document.getElementById('budgetInput').value=prof.weekly_budget;
  }
  // List sub
  const total=prof.ingredients?.length||0;
  const bought=prof.ingredients?.filter((_,i)=>checked[i]).length||0;
  document.getElementById('homeListSub').textContent=
    total>0?`${bought}/${total} ta belgilangan`:t.no_list_sub;

  // Last items
  const wrap=document.getElementById('homeLastItems');
  if(!prof.ingredients||prof.ingredients.length===0){
    wrap.innerHTML=`<div class="prev-row" style="justify-content:center;padding:20px 16px">
      <span style="font-size:13px;color:var(--hint)">${t.no_list}</span></div>`;
    return;
  }
  const EMOJIS=['🥩','🥔','🧅','🥕','🍅','🧄','🌿','🫙','🧂','🍞','🥚','🧈','🫒','🍋','🍗','🌾'];
  const rows=prof.ingredients.slice(0,5).map((item,i)=>{
    const d=!!checked[i];
    return `<div class="prev-row">
      <span class="prev-emoji">${EMOJIS[i%EMOJIS.length]}</span>
      <span class="prev-name${d?' done':''}">${item.name}</span>
      <span class="prev-price">${item.price||''}</span>
    </div>`;
  }).join('');
  const more=prof.ingredients.length>5
    ?`<div class="prev-row" style="justify-content:center"><span style="font-size:12px;color:var(--hint)">+${prof.ingredients.length-5} ta ko'proq →</span></div>`:'';
  wrap.innerHTML=rows+more;
}

function renderChips(){
  const t=L();
  const qc=document.getElementById('quickChips');
  if(qc) qc.innerHTML=t.quick.map(q=>`<span class="chip" onclick="pickChip(this,'q','${q}')">${q}</span>`).join('');
  const rc=document.getElementById('recipeChips');
  if(rc) rc.innerHTML=t.popular.map(r=>`<span class="chip" onclick="pickChip(this,'r','${r}')">${r}</span>`).join('');
}

function pickChip(el,type,val){
  const id=type==='q'?'quickChips':'recipeChips';
  document.querySelectorAll(`#${id} .chip`).forEach(c=>c.classList.remove('on'));
  el.classList.add('on');
  document.getElementById(type==='q'?'preferenceInput':'recipeInput').value=val;
}

function renderPrefList(){
  const lang=prof.language;
  const hint=lang==='uz'?'AI bu mahsulotlarni tavsiya qilmaydi':'AI исключит эти продукты из рекомендаций';
  document.getElementById('prefList').innerHTML=
    `<div style="padding:10px 16px 4px;font-size:11px;color:var(--hint)">${hint}</div>`+
    PREFS.map(p=>{
      const on=prof.preferences.includes(p.id);
      return `<div class="pref-row">
        <span class="pr-icon">${p.icon}</span>
        <span class="pref-name">${p[lang]||p.uz}</span>
        <label class="toggle">
          <input type="checkbox" ${on?'checked':''} onchange="togglePref('${p.id}',this)">
          <div class="t-track"></div>
          <div class="t-thumb"></div>
        </label>
      </div>`;
    }).join('');
}

function togglePref(id,el){
  const idx=prof.preferences.indexOf(id);
  if(el.checked){if(idx===-1)prof.preferences.push(id);}
  else{if(idx>-1)prof.preferences.splice(idx,1);}
}

function renderProfile(){
  document.getElementById('familyInput').value=prof.family_size;
  document.getElementById('budgetProfileInput').value=prof.weekly_budget||'';
  document.getElementById('lz').classList.toggle('on',prof.language==='uz');
  document.getElementById('lr').classList.toggle('on',prof.language==='ru');
  renderPrefList();
}

function renderShopList(){
  const t=L();
  const wrap=document.getElementById('shopWrap');
  if(!prof.ingredients||prof.ingredients.length===0){
    wrap.innerHTML=`<div class="empty"><div class="ei">🛒</div><h3>${t.list_empty}</h3><p>${t.list_empty_sub}</p></div>`;
    return;
  }
  const rows=prof.ingredients.map((item,i)=>{
    const d=!!checked[i];
    return `<div class="list-item">
      <button class="l-chk${d?' done':''}" onclick="togIng(${i})">${d?'✓':''}</button>
      <span class="l-name${d?' done':''}">${item.name}</span>
      <span class="l-price">${item.price||''}</span>
      <button class="l-del" onclick="delIng(${i})">🗑️</button>
    </div>`;
  }).join('');
  const bought=prof.ingredients.filter((_,i)=>checked[i]).length;
  wrap.innerHTML=`<div class="shop-wrap">
    ${rows}
    <div class="list-total">
      <span class="list-total-l">${t.total}</span>
      <span class="list-total-r">${bought}/${prof.ingredients.length} ta</span>
    </div>
  </div>
  <button class="btn btn-danger mt8" onclick="clearList()">${t.clear}</button>`;
}

function togIng(i){
  checked[i]=!checked[i];
  localStorage.setItem('chk_'+userId,JSON.stringify(checked));
  renderShopList();renderHome();
}

function delIng(i){
  prof.ingredients.splice(i,1);
  const nc={};
  Object.keys(checked).forEach(k=>{const ki=parseInt(k);if(ki<i)nc[k]=checked[k];else if(ki>i)nc[ki-1]=checked[k];});
  checked=nc;
  localStorage.setItem('chk_'+userId,JSON.stringify(checked));
  renderShopList();renderHome();
}

function clearList(){
  const t=L();
  const go=()=>{prof.ingredients=[];checked={};localStorage.setItem('chk_'+userId,'{}');renderShopList();renderHome();};
  if(tg){tg.showConfirm(t.clear_confirm,ok=>{if(ok)go();});}
  else if(confirm(t.clear_confirm))go();
}

// ─── AI ─────────────────────────────────────────
function loader(id){
  document.getElementById(id).innerHTML=`<div class="loader"><div class="spin"></div><p>${L().loading}</p></div>`;
}

function errMsg(id){
  document.getElementById(id).innerHTML=`<div class="err">${L().err}</div>`;
}

function foodCard(mealName, priceStr, ingredients, addFn){
  const t=L();
  const MAP={'osh':'🍛',"lag'mon":'🍜','manti':'🥟','shurva':'🍲','somsa':'🥮','dimlama':'🥘','пlov':'🍛','плов':'🍛','лагман':'🍜','суп':'🍲','манты':'🥟'};
  let emoji='🍽️';
  const low=mealName.toLowerCase();
  for(const[k,v]of Object.entries(MAP)){if(low.includes(k)){emoji=v;break;}}
  const ingrRows=(ingredients||[]).slice(0,6).map(x=>`<li>${x.name}</li>`).join('');
  return `<div class="food-card">
    <div class="food-img">
      <span style="filter:drop-shadow(0 4px 16px rgba(0,0,0,.5))">${emoji}</span>
      <div class="food-img-name">${mealName}</div>
    </div>
    <div style="padding:16px">
      ${priceStr?`<div class="food-price">${priceStr}</div>`:''}
      ${ingrRows?`<div class="food-ingr-t">${t.ingr_title}</div><ul class="food-ingr">${ingrRows}</ul>`:''}
      <button class="add-btn" onclick="${addFn}">🛒 ${t.add_btn}</button>
    </div>
  </div>`;
}

function showResult(id, text, mealName, ingredients){
  const fmt=text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'$1');
  const pm=text.match(/[~≈]?\s*([\d\s,]+)\s*(so['']?m|сум)/i);
  const price=pm?pm[0]:'';
  let html=`<div class="result">${fmt}</div>`;
  if(mealName&&ingredients&&ingredients.length>0){
    html+=foodCard(mealName,price,ingredients,`addToList(this,'${mealName.replace(/'/g,"\\'")}')`);
  }
  document.getElementById(id).innerHTML=html;
  document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});
}

function addToList(btn,name){
  // ingredients already in prof from doSuggest/doRecipe
  checked={};localStorage.setItem('chk_'+userId,'{}');
  renderShopList();renderHome();
  btn.textContent='✅ '+( prof.language==='uz'?'Qo\'shildi!':'Добавлено!');
  btn.style.background='var(--green-d)';btn.disabled=true;
  toast(L().added);
  setTimeout(()=>goTab('list'),1000);
}

async function doSuggest(){
  const pref=document.getElementById('preferenceInput').value.trim();
  if(!pref){toast(prof.language==='uz'?"Iltimos, yozing":'Введите текст');return;}
  loader('suggestResult');
  try{
    const d=await api('/api/suggest','POST',{user_id:userId,preference:pref});
    if(d.error)throw new Error(d.error);
    prof.meal_name=d.meal_name;prof.ingredients=d.ingredients||[];
    checked={};localStorage.setItem('chk_'+userId,'{}');
    showResult('suggestResult',d.text,d.meal_name,d.ingredients);
    renderHome();
  }catch(e){errMsg('suggestResult');}
}

async function doRecipe(){
  const name=document.getElementById('recipeInput').value.trim();
  if(!name){toast(prof.language==='uz'?"Ovqat nomini yozing":'Введите название');return;}
  loader('recipeResult');
  try{
    const d=await api('/api/recipe','POST',{user_id:userId,meal_name:name});
    if(d.error)throw new Error(d.error);
    if(d.ingredients&&d.ingredients.length>0){prof.meal_name=name;prof.ingredients=d.ingredients;}
    showResult('recipeResult',d.text,name,d.ingredients);
    renderHome();
  }catch(e){errMsg('recipeResult');}
}

async function doBudgetPlan(){
  const budget=parseFloat(document.getElementById('budgetInput').value);
  if(!budget||budget<10000){toast(prof.language==='uz'?'Kamida 10 000 so\'m':'Минимум 10 000 сум');return;}
  loader('budgetResult');
  try{
    const d=await api('/api/budget-plan','POST',{user_id:userId,budget});
    if(d.error)throw new Error(d.error);
    prof.weekly_budget=budget;renderHome();
    showPlan('budgetResult',d.text,d.ingredients||[],prof.language==='uz'?'Haftalik reja':'Недельный план');
  }catch(e){errMsg('budgetResult');}
}

async function doWeeklyPlan(){
  loader('budgetResult');
  try{
    const d=await api('/api/weekly-plan','POST',{user_id:userId});
    if(d.error)throw new Error(d.error);
    showPlan('budgetResult',d.text,d.ingredients||[],prof.language==='uz'?'Haftalik reja':'Недельный план');
  }catch(e){errMsg('budgetResult');}
}

function showPlan(id, text, ingredients, title){
  lastPlan={text,ingredients,title};
  const t=L();
  const fmt=text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'$1');
  let ingHtml='';
  if(ingredients&&ingredients.length>0){
    const rows=ingredients.slice(0,8).map(x=>`<li>${x.name}${x.price?' — '+x.price:''}</li>`).join('');
    ingHtml=`<div class="food-card" style="margin-top:12px">
      <div style="padding:16px">
        <div style="font-size:15px;font-weight:700;margin-bottom:10px">🛒 ${t.weekly_ingr} (${ingredients.length} ta)</div>
        <ul class="food-ingr" style="margin-bottom:16px">${rows}</ul>
        <button class="add-btn" onclick="savePlan(this)">${t.add_btn}</button>
      </div>
    </div>`;
  }
  document.getElementById(id).innerHTML=`<div class="result">${fmt}</div>${ingHtml}`;
  document.getElementById(id).scrollIntoView({behavior:'smooth',block:'start'});
}

async function savePlan(btn){
  btn.disabled=true;const t=L();
  try{
    if(userId) await api('/api/save-plan','POST',{user_id:userId,meal_name:lastPlan.title,plan_text:lastPlan.text});
    prof.meal_name=lastPlan.title;prof.ingredients=lastPlan.ingredients||[];
    checked={};localStorage.setItem('chk_'+userId,'{}');
    renderShopList();renderHome();
    btn.textContent='✅ '+( prof.language==='uz'?'Qo\'shildi!':'Добавлено!');
    btn.style.background='var(--green-d)';
    toast(t.added);
    setTimeout(()=>goTab('list'),1000);
  }catch(e){btn.disabled=false;toast(t.err);}
}

// ─── PROFILE SAVE ────────────────────────────────
async function saveProfile(){
  prof.family_size=Math.max(1,Math.min(20,parseInt(document.getElementById('familyInput').value)||2));
  prof.weekly_budget=parseFloat(document.getElementById('budgetProfileInput').value)||0;
  if(userId){
    await api('/api/profile','POST',{
      user_id:userId,family_size:prof.family_size,
      weekly_budget:prof.weekly_budget,language:prof.language,
      preferences:prof.preferences
    });
  }
  toast(L().saved);renderAll();
}

async function setLang(lang){
  prof.language=lang;
  document.getElementById('lz').classList.toggle('on',lang==='uz');
  document.getElementById('lr').classList.toggle('on',lang==='ru');
  if(userId) await api('/api/profile','POST',{user_id:userId,language:lang});
  renderAll();
}

// ─── NAV ─────────────────────────────────────────
function goTab(tab){
  navStack.push(curTab);curTab=tab;
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.querySelectorAll('.nb').forEach(b=>b.classList.remove('on'));
  document.getElementById('scr-'+tab).classList.add('on');
  const nb=document.getElementById('nb-'+tab);
  if(nb)nb.classList.add('on');
  window.scrollTo(0,0);
}

function setSuggestTab(tab){
  ['suggest','recipe','budget'].forEach(t=>{
    document.getElementById('st-'+t).classList.toggle('on',t===tab);
    document.getElementById('sub-'+t).style.display=t===tab?'block':'none';
  });
  setSuggestTabText(tab);
}

function setSuggestTabText(tab){
  const cur=tab||(['suggest','recipe','budget'].find(t=>document.getElementById('st-'+t).classList.contains('on'))||'suggest');
  const map={suggest:L().suggest_h,recipe:L().recipe_h,budget:L().budget_h};
  const el=document.getElementById('suggestHdrT');
  if(el)el.textContent=map[cur]||map.suggest;
}

// ─── UTILS ───────────────────────────────────────
function fmtNum(n){return Number(n).toLocaleString('uz-UZ');}
function toast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg;el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}

loadProfile();
</script>
</body>
</html>
